name: Build & Release AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      upload_alpha:
        description: 'Upload signed bundle to the closed-testing Alpha track'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3's default includes the removed 'tools' package on older action builds.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make gradlew executable
        working-directory: CallMeNot
        run: chmod +x gradlew

      - name: Run unit tests and compile debug app
        working-directory: CallMeNot
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Validate minified release bundle without signing secrets
        if: github.event_name != 'workflow_dispatch'
        working-directory: CallMeNot
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch'
        run: |
          install -d -m 700 "$GITHUB_WORKSPACE/CallMeNot/app/keystore"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/CallMeNot/app/keystore/release.keystore"
          test -s "$GITHUB_WORKSPACE/CallMeNot/app/keystore/release.keystore"
          echo "KEYSTORE_ABSOLUTE=$GITHUB_WORKSPACE/CallMeNot/app/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: github.event_name == 'workflow_dispatch'
        working-directory: CallMeNot
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_ABSOLUTE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: callmenot-release-${{ github.run_number }}
          path: CallMeNot/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play (Alpha)
        if: github.event_name == 'workflow_dispatch' && inputs.upload_alpha
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.callmenot.app
          releaseFiles: CallMeNot/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
